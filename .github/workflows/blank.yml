name: Convert XLSM to JSON/CSV and publish to page branch

on:
  push:
    branches:
      - data   # trigger when you push to data branch

# Allow workflow to push back to the repo via GITHUB_TOKEN
permissions:
  contents: write

jobs:
  convert-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout the 'data' branch where you upload the .xlsm
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Convert XLSM to CSV & JSON
        run: |
          set -e
          # find first .xlsm in workspace
          FILE=$(ls *.xlsm 2>/dev/null | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "❌ No .xlsm file found in repository root."
            exit 1
          fi
          echo "Converting $FILE ..."
          python - <<'PY'
import pandas as pd, os, sys
file = next((f for f in os.listdir('.') if f.endswith('.xlsm')), None)
if not file:
    print("No .xlsm file found.")
    sys.exit(1)
# read first sheet; if you want a specific sheet use sheet_name="Sheet1"
df = pd.read_excel(file, engine="openpyxl")
df.to_csv("data.csv", index=False)
df.to_json("data.json", orient="records", indent=2, force_ascii=False)
print("Wrote data.csv and data.json")
PY

      - name: Prepare page branch repo (clone or create)
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REMOTE="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          echo "REMOTE = $REMOTE"
          # create a clean directory for the page branch contents
          mkdir page_repo
          cd page_repo
          git init
          git remote add origin "${REMOTE}"

          # If 'page' branch exists on remote, fetch & checkout it; otherwise create orphan
          if git ls-remote --heads origin page | grep -q refs/heads/page; then
            echo "page branch exists on remote => checking out"
            git fetch origin page
            git checkout -b page origin/page
          else
            echo "page branch does NOT exist => creating orphan 'page' branch with minimal index.html"
            git checkout --orphan page
            # remove any lingering files
            git rm -rf . || true
            # create minimal index.html (you can replace this in the page branch later)
            cat > index.html <<'HTML'
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Search Page</title></head>
<body><h1>Search Page</h1><p>Add your real index.html to the page branch.</p></body>
</html>
HTML
            git add index.html
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "Init page branch"
            git push origin page
          fi

          # Copy generated files (from the workspace root) into this page repo
          cp ../data.csv .
          cp ../data.json .

          # Add, commit & push only if there are changes
          git add data.csv data.json || true
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "Update data files from data branch"
            git push origin page
            echo "✅ data files pushed to page branch"
          else
            echo "No changes to data files — nothing to commit"
          fi
