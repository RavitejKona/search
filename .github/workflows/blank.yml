name: Convert XLSM to JSON/CSV

on:
  push:
    branches:
      - data   # Trigger only when .xlsm is pushed to data branch

permissions:
  contents: write   # allow pushing back to the repo

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      # Checkout the data branch (where .xlsm is stored)
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data

      # Install Python (for conversion script)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      # Convert XLSM to CSV and JSON
      - name: Convert XLSM to CSV/JSON
        run: |
          ls -l
          FILE=$(ls *.xlsm | head -n 1)   # pick first xlsm file
          echo "Processing $FILE"
          python - <<'EOF'
import pandas as pd, json, os

file = [f for f in os.listdir('.') if f.endswith('.xlsm')][0]
df = pd.read_excel(file, engine="openpyxl")

# Save CSV
df.to_csv("data.csv", index=False)

# Save JSON
df.to_json("data.json", orient="records", indent=2, force_ascii=False)

print("✅ Converted:", file)
EOF

      # Checkout page branch (where we store output files)
      - name: Checkout page branch
        uses: actions/checkout@v4
        with:
          ref: page
          path: page

      # Copy generated files into page branch
      - name: Copy output files
        run: |
          cp data.csv data.json page/

      # Commit and push changes using EndBug/add-and-commit
      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: actions@github.com
          message: "Update data files from data branch"
          add: "data.csv data.json"
          cwd: page
          branch: page
