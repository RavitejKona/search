<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Search</title>
  <style>
/*     body {
      font-family: Arial, sans-serif;
      margin: 40px;
/*       background: url('https://upload.wikimedia.org/wikipedia/en/6/6c/Asian_Institute_of_Technology-Logo.png') no-repeat center top; */
      background-size: 150px 150px;
      padding-top: 180px; /* So content doesn't overlap the logo */
    } */

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .header img {
      height: 50px;
      width: 50px;
      margin-right: 10px;
    }

    .header span {
      font-size: 51px;
      font-weight: bold;
      color: #7bca0c;
    }

    input {
      width: 300px;
      padding: 8px;
      font-size: 14px;
      border: 2px solid #7bca0c;
      border-radius: 5px;
    }

    .result {
      margin-top: 20px;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 8px;
      background-color: #b5ebad;
      color: #000; /* better readability */
      box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
    }

    .result strong {
      font-size: 18px;
      display: block;
      margin-bottom: 5px;
    }

    .result p {
      margin: 2px 0;
    }
  </style>
</head>
<body>
  <!-- Header with logo -->
  <div class="header">
    <img src="./logo.jpeg" alt="AIT Logo" />
    <span>AIT Extension - HEART</span>
  </div>

  <h2>Search Profiles</h2>
  <input type="text" id="searchBox" placeholder="Search anything..." />

  <div id="results"></div>

  <script>
    let data = [];

    // Load JSON generated by GitHub Actions
    fetch("data.json")
      .then(res => res.json())
      .then(json => data = json);

    document.getElementById("searchBox").addEventListener("input", function() {
      const query = this.value.toLowerCase();
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      // Filter: if any field in row contains the query
      const results = data.filter(row => {
        return Object.values(row).some(val =>
          val && val.toString().toLowerCase().includes(query)
        );
      });

      // Show only specific fields
      results.forEach(r => {
        resultsDiv.innerHTML += `
          <div class="result">
            <strong>${r.Name || "Unknown"}</strong>
            <p><b>Email:</b> ${ (r["Contact "] || "").match(/[\w.-]+@[\w.-]+/)?.[0] || "N/A" }</p>
            <p><b>Position:</b> ${r["Position / Title"] || "N/A"}</p>
            <p><b>Qualification:</b> ${r["Qualification (degrees, certifications)"] || "N/A"}</p>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
