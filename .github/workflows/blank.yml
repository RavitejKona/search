name: Convert XLSM to JSON/CSV

on:
  push:
    branches:
      - data   # Trigger only when pushing to data branch

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run conversion script
        run: python convert.py

      - name: Save generated files
        run: |
          mkdir /tmp/artifacts
          cp data.csv /tmp/artifacts/
          cp data.json /tmp/artifacts/

      - name: Checkout page branch
        uses: actions/checkout@v4
        with:
          ref: page
          fetch-depth: 0

      - name: Restore generated files
        run: |
          cp /tmp/artifacts/data.csv .
          cp /tmp/artifacts/data.json .

      - name: Commit and push to page branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.csv data.json
          git commit -m "Update data files from data branch" || echo "No changes to commit"
          git push origin page
