<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    input { width: 300px; padding: 8px; font-size: 14px; }
    .result { margin-top: 20px; border: 1px solid #ddd; padding: 12px; border-radius: 8px; }
    .result strong { font-size: 18px; display: block; margin-bottom: 5px; }
    .result p { margin: 2px 0; }
  </style>
</head>
<body>
  <h2>Search Profiles</h2>
  <input type="text" id="searchBox" placeholder="Search anything..." />

  <div id="results"></div>

  <script>
    let data = [];

    // Load JSON generated by GitHub Actions
    fetch("data.json")
      .then(res => res.json())
      .then(json => data = json);

    document.getElementById("searchBox").addEventListener("input", function() {
      const query = this.value.toLowerCase();
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      // Filter: if any field in row contains the query
      const results = data.filter(row => {
        return Object.values(row).some(val =>
          val && val.toString().toLowerCase().includes(query)
        );
      });

      // Show only specific fields
      results.forEach(r => {
        resultsDiv.innerHTML += `
          <div class="result">
            <strong>${r.Name || "Unknown"}</strong>
            <p><b>Email:</b> ${r.Email || "N/A"}</p>
            <p><b>Position:</b> ${r.Position || "N/A"}</p>
            <p><b>Qualification:</b> ${r["Qualification (degrees, certifications)"] || "N/A"}</p>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
